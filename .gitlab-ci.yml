stages:
  - deploy

deploy-testh:
  tags:
    - kub-prod
  stage: deploy
  image: alpine
  only:
    - stage
  before_script:
    - apk add --no-cache openssh rsync
    - eval $(ssh-agent -s)
    - cat "$SSH_PRIVATE_GITLAB" | ssh-add - > /dev/null
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - rsync -avh --delete --exclude=".ssh" --exclude=".gitlab-ci" . git@172.31.11.149:/var/www/logistic  -e "ssh -o StrictHostKeyChecking=no"; 
