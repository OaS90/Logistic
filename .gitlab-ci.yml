stages:
  - build
  - deploy

.init-env-container: &init-env-container
  - |
    if [[ "main" = "${CI_COMMIT_BRANCH}" ]];
    then
      if [[ -f ${CONFIG_ENV_PROD} ]];
      then
        cat "${CONFIG_ENV_PROD}" >> .env;
        echo added CONFIG_ENV_PROD to .env
      else
        echo file CONFIG_ENV_PROD not found
        exit 1
      fi
    fi

    if [[ "stage" = "${CI_COMMIT_BRANCH}" ]];
    then
      if [[ -f ${CONFIG_ENV_STAGE} ]];
      then
        cat "${CONFIG_ENV_STAGE}" >> .env;
        echo added CONFIG_ENV_STAGE to .env
      else
        echo file CONFIG_ENV_STAGE not found
        exit 1
      fi
    fi

build:
  stage: build
  tags:
    - kub-prod
  script:
    - *init-env-container
  only:
    - stage
    - main

deploy-testh:
  tags:
    - kub-prod
  stage: deploy
  image: alpine
  only:
    - stage
  before_script:
    - apk add --no-cache openssh rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_GITLAB" > ~/priv_key
    - chmod 600 ~/priv_key
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - rsync -avh --exclude=".git" --exclude=".gitlab-ci.yml" --exclude="storage" --exclude=".env" --exclude="node_modules". git@172.31.11.149:/var/www/logistic  -e "ssh -o StrictHostKeyChecking=no -i ~/priv_key";
    - ssh -o StrictHostKeyChecking=no -i ~/priv_key git@172.31.11.149 'cd /var/www/logistic && composer install --ignore-platform-reqs;'
