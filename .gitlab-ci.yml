stages:
  - deploy

deploy-testh:
  tags:
    - kub-prod
  stage: deploy
  image: alpine
  only:
    - stage
  before_script:
    - apk add --no-cache openssh rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_GITLAB" > ~/priv_key
    - chmod 600 ~/priv_key
    - mv "$CONFIG_ENV_STAGE" ~/config.env
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - rsync -avh --progress --exclude=".git" --exclude=".gitlab-ci.yml" --exclude="storage" --exclude=".env" --exclude="node_modules" . git@172.31.11.149:/var/www/logistic -e "ssh -o StrictHostKeyChecking=no -i ~/priv_key";
    - ssh -o StrictHostKeyChecking=no -i ~/priv_key git@172.31.11.149 'cd /var/www/logistic && composer install --ignore-platform-reqs;'
    - cat ~/config.env | ssh -o StrictHostKeyChecking=no -i ~/priv_key git@172.31.11.149 'cat > /var/www/logistic/.env'
