stages:
  - build
  - deploy

build:
  stage: build
  image: php:8.2-fpm-alpine
  script:
    - apk add --no-cache git curl unzip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-dev --optimize-autoloader

deploy-testh:
  tags:
    - kub-prod
  stage: deploy
  image: php:8.2-fpm-alpine
  only:
    - stage
  before_script:
    - apk add --no-cache openssh rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_GITLAB" > ~/priv_key
    - chmod 600 ~/priv_key
  script:
    - echo "This job deploys something from the $CI_COMMIT_BRANCH branch."
    - rsync -avh --delete --exclude=".ssh" --exclude=".gitlab-ci" . git@172.31.11.149:/var/www/logistic  -e "ssh -o StrictHostKeyChecking=no -i ~/priv_key";
